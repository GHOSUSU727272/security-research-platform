  - {key: strings, plugin: strings, priority: 1, timeout: 600}
  - {key: imports, plugin: imports, priority: 1, timeout: 600}
  - {key: config, plugin: config, priority: 1, timeout: 600}
  - {key: logs, plugin: logs, priority: 1, timeout: 600}
