[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-platform"
version = "0.4.1"
description = "Local authorized software research workbench"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "pyelftools>=0.32,<1", "capstone>=5,<6", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
agent = ["httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "Pillow>=11,<13", "pycryptodome>=3.20,<5", "playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "mypy>=1.11,<2", "ruff>=0.9,<1", "types-PyYAML>=6"]

[project.scripts]
ctf-panel = "ctf.panel:main"
research = "core.cli:main"

[tool.setuptools.packages.find]
include = ["ctf*", "core*", "database*", "analysis*", "dynamic*", "reports*", "plugins*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["kesl-snapshot", "config/discovered"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["kesl-snapshot/", "config/discovered/"]

[[tool.mypy.overrides]]
module = ["elftools.*", "capstone.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"ctf" = ["panel.html"]
"plugins.ghidra" = ["*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
